<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#07080f">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>밤의 작은 상담소</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307080f'/%3E%3Cpath d='M11 27V14a5 5 0 0 1 10 0v13z' fill='%232a1d14' stroke='%23ece7db' stroke-opacity='.3'/%3E%3Cpath d='M13.5 16a2.5 2.5 0 0 1 5 0v3h-5z' fill='%23f3b25a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/door.css">
<link rel="stylesheet" href="css/room.css">
<link rel="stylesheet" href="css/tarot.css">
</head>
<body>

<!-- 문 화면. 아래 문구는 화면이 뜨는 동안만 보이고, 곧 js/copy.js의 문구로 바뀐다. -->
<main id="door-view" class="door-screen">
  <svg id="door-svg" class="door" viewBox="0 0 120 150" aria-hidden="true">
    <circle class="glow" cx="60" cy="88" r="44"/>
    <path class="frame" d="M18 150V62a42 42 0 0 1 84 0v88z"/>
    <path class="leaf" d="M36 150V72a24 24 0 0 1 48 0v78z"/>
    <path class="pane" d="M47 82a13 13 0 0 1 26 0v18H47z"/>
    <path class="bars" d="M60 69v31M47 90h26"/>
    <circle class="knob" cx="76" cy="118" r="2.6"/>
  </svg>
  <p class="name">밤의 작은 상담소</p>
  <h1 id="door-title">문을 살피는 중이에요</h1>
  <p id="door-lead" class="lead">잠시만 기다려 주세요.</p>
  <button id="door-action" class="main" type="button" hidden></button>
  <p id="door-note" class="note" hidden></p>
  <p class="help">지금 많이 힘들다면 기다리지 말고 연락하세요. 자살예방상담전화 <strong>109</strong>, 청소년상담전화 <strong>1388</strong>, 긴급 신고 <strong>119 · 112</strong></p>
</main>

<!-- 상담실 -->
<main id="room-view" class="room" hidden>
  <header class="room-head">
    <span class="who"><span class="lamp" aria-hidden="true"></span><span class="name">밤의 작은 상담소</span></span>
  </header>
  <p id="conn" class="conn" role="status" hidden>연결이 잠시 끊겼어요. 다시 잇는 중이에요.</p>
  <div class="room-body">
    <section id="table" class="table" aria-label="타로 탁자" hidden></section>
    <section id="chat" class="chat" aria-label="대화"></section>
  </div>
</main>

<noscript><p class="lead" style="margin:24px auto;text-align:center">이 페이지는 자바스크립트를 켜야 열려요.</p></noscript>
<script type="module" src="js/guest.js"></script>
</body>
</html>
