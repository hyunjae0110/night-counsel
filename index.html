<!-- 판 번호: 화면 파일(css, js)을 바꾸면 이 파일과 다른 HTML의 ?v= 숫자를 모두 같은 새 숫자로 올린다.
     새로고침하면 바로 새 파일을 받게 하려는 것이다. -->
<script type="importmap">
{
  "imports": {
    "./js/cards.js": "./js/cards.js?v=4",
    "./js/chat.js": "./js/chat.js?v=4",
    "./js/copy.js": "./js/copy.js?v=4",
    "./js/firebase.js": "./js/firebase.js?v=4",
    "./js/session.js": "./js/session.js?v=4",
    "./js/sound.js": "./js/sound.js?v=4",
    "./js/tarot.js": "./js/tarot.js?v=4"
  }
}
</script>
<link rel="stylesheet" href="css/tokens.css?v=4">
<link rel="stylesheet" href="css/base.css?v=4">
<link rel="stylesheet" href="css/door.css?v=4">
<link rel="stylesheet" href="css/room.css?v=4">
<link rel="stylesheet" href="css/tarot.css?v=4">
</head>
<body>

<!-- 문 화면. 아래 문구는 화면이 뜨는 동안만 보이고, 곧 js/copy.js의 문구로 바뀐다. -->
<main id="door-view" class="door-screen">
  <svg id="door-svg" class="door" viewBox="0 0 120 150" aria-hidden="true">
    <circle class="glow" cx="60" cy="88" r="44"/>
    <path class="frame" d="M18 150V62a42 42 0 0 1 84 0v88z"/>
    <path class="leaf" d="M36 150V72a24 24 0 0 1 48 0v78z"/>
    <path class="pane" d="M47 82a13 13 0 0 1 26 0v18H47z"/>
    <path class="bars" d="M60 69v31M47 90h26"/>
    <circle class="knob" cx="76" cy="118" r="2.6"/>
  </svg>
  <p class="name">밤의 작은 상담소</p>
  <h1 id="door-title">문을 살피는 중이에요</h1>
  <p id="door-lead" class="lead">잠시만 기다려 주세요.</p>
  <button id="door-action" class="main" type="button" hidden></button>
  <!-- 안내: 초대 링크 없이 온 사람에게만 보인다. 문구는 js/copy.js에서 채운다. -->
  <div id="landing" class="landing" hidden></div>
  <p class="help">지금 많이 힘들다면 기다리지 말고 연락하세요. 자살예방상담전화 <strong>109</strong>, 청소년상담전화 <strong>1388</strong>, 긴급 신고 <strong>119 · 112</strong></p>
</main>

<!-- 이용 약속. 문구는 js/copy.js에서 채운다. -->
<main id="promise-view" class="door-screen promise-screen" hidden>
  <p class="name">밤의 작은 상담소</p>
  <h1 id="promise-title" tabindex="-1"></h1>
  <ol id="promise-list" class="promise"></ol>
  <label class="agree"><input id="agree" type="checkbox"><span id="agree-text"></span></label>
  <button id="sit" class="main" type="button" disabled></button>
  <p id="sit-note" class="note" role="alert" hidden></p>
  <button id="promise-back" class="quiet" type="button"></button>
  <p class="help">지금 많이 힘들다면 기다리지 말고 연락하세요. 자살예방상담전화 <strong>109</strong>, 청소년상담전화 <strong>1388</strong>, 긴급 신고 <strong>119 · 112</strong></p>
</main>

<!-- 상담실 -->
<main id="room-view" class="room" hidden>
  <header class="room-head">
    <span class="who"><span class="lamp" aria-hidden="true"></span><h1 class="name">밤의 작은 상담소</h1></span>
    <span class="side">
      <span id="clock" class="clock" hidden></span>
      <button id="leave" class="quiet" type="button">나가기</button>
    </span>
    <span id="clock-say" class="sr" role="status"></span>
  </header>
  <p id="conn" class="conn" role="status" hidden>연결이 잠시 끊겼어요. 다시 잇는 중이에요.</p>
  <p id="peer" class="conn" role="status" hidden></p>
  <div class="room-body">
    <section id="table" class="table" aria-label="타로 탁자" hidden></section>
    <section id="chat" class="chat" aria-label="대화"></section>
  </div>
</main>

<noscript><p class="lead" style="margin:24px auto;text-align:center">이 페이지는 자바스크립트를 켜야 열려요.</p></noscript>
<script type="module" src="js/guest.js?v=4"></script>
</body>
</html>
